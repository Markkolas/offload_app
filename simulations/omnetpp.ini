[General]
abstract = true
# General options in here

[InitSimpleConf]
network = SimpleNet
sim-time-limit = 100s

#**.out.channel.datarate = 100Mbps
#*.server.N_CORES = ${cores=1..16 step 1}
#*.user.out.channel.DynDelay = uniform(90ms,110ms)
#*.user.out.channel.DynDelay = ${d=exponential(100ms), uniform(90ms,110ms)}
#*.server.out.channel.DynDelay = ${d}

[MultiSimpleConf]
warmup-period = 1s
extends = InitSimpleConf
SimpleNet.N_USERS = 5

*.user[0].posx = 0
*.user[1].posx = 100
*.user[2].posx = 200
*.user[3].posx = 300
*.user[4].posx = 400

*.user[*].MIN_TASK_S = ${size=1000..10000 step 1000}
*.user[*].MAX_TASK_S = 10*${size}
*.user[*].tasksGenPeriod = ${period=1..40 step 1}ms